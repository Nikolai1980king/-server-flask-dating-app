<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простое создание профиля</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin: 15px 0; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; }
        button { background: #007bff; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Простое создание профиля</h1>
    
    <form id="simpleForm" enctype="multipart/form-data">
        <div class="form-group">
            <input type="text" name="name" value="Тест" maxlength="12" required placeholder="Имя">
        </div>
        
        <div class="form-group">
            <input type="number" name="age" value="25" required placeholder="Возраст">
        </div>
        
        <div class="form-group">
            <select name="gender" required>
                <option value="Мужчина" selected>Мужчина</option>
                <option value="Женщина">Женщина</option>
            </select>
        </div>
        
        <div class="form-group">
            <input type="text" name="hobbies" value="Тест" required placeholder="Хобби">
        </div>
        
        <div class="form-group">
            <input type="text" name="goal" value="Тест" required placeholder="Цель">
        </div>
        
        <div class="form-group">
            <input type="text" name="city" value="Москва" required placeholder="Город">
        </div>
        
        <div class="form-group">
            <input type="text" name="venue" value="Тест" required placeholder="Место">
        </div>
        
        <div class="form-group">
            <input type="number" name="latitude" value="57.684631" step="0.000001" required placeholder="Широта">
        </div>
        
        <div class="form-group">
            <input type="number" name="longitude" value="106.075272" step="0.000001" required placeholder="Долгота">
        </div>
        
        <div class="form-group">
            <input type="file" name="photo" accept="image/*" required>
            <small>Выберите изображение</small>
        </div>
        
        <div class="form-group">
            <label>
                <input type="checkbox" name="terms_accepted" checked required>
                Согласен с условиями
            </label>
        </div>
        
        <button type="submit">Создать профиль</button>
    </form>
    
    <div id="result" class="result" style="display: none;"></div>

    <script>
        document.getElementById('simpleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            console.log('🚀 Отправляем форму...');
            document.getElementById('result').innerHTML = '🔄 Создаем профиль...';
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').className = 'result';
            
            try {
                const formData = new FormData(this);
                
                const response = await fetch('/create', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('📥 Ответ:', response.status, response.statusText);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('📊 Данные:', data);
                    
                    if (data.success) {
                        document.getElementById('result').innerHTML = `✅ Профиль создан!<br>ID: ${data.user_id}<br>Перенаправляем на: ${data.redirect}`;
                        document.getElementById('result').className = 'result success';
                        
                        // Устанавливаем cookie
                        document.cookie = `user_id=${data.user_id}; path=/; max-age=${365*24*60*60}; SameSite=Lax`;
                        localStorage.setItem('dating_app_user_id', data.user_id);
                        
                        console.log('✅ Cookie установлен');
                        console.log('🔄 Перенаправляем на:', data.redirect);
                        
                        // Перенаправляем
                        setTimeout(() => {
                            window.location.href = data.redirect || '/payment';
                        }, 2000);
                        
                    } else {
                        document.getElementById('result').innerHTML = `❌ Ошибка: ${data.error}`;
                        document.getElementById('result').className = 'result error';
                    }
                } else {
                    const errorText = await response.text();
                    console.log('❌ Ошибка:', errorText);
                    document.getElementById('result').innerHTML = `❌ HTTP ошибка: ${response.status}`;
                    document.getElementById('result').className = 'result error';
                }
            } catch (error) {
                console.error('💥 Исключение:', error);
                document.getElementById('result').innerHTML = `💥 Ошибка: ${error.message}`;
                document.getElementById('result').className = 'result error';
            }
        });
    </script>
</body>
</html>
