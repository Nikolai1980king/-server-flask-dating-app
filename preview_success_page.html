<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успешна - Предварительный просмотр</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            min-height: 100vh;
            color: white;
        }
        .success-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .success-icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        .success-message {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .continue-btn {
            background: #a709b5;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .continue-btn:hover {
            background: #8a0799;
            transform: translateY(-2px);
        }
        .demo-notice {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid rgba(255, 193, 7, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .demo-notice h4 {
            margin: 0 0 10px 0;
            color: #ffc107;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="demo-notice">
            <h4>🎨 Предварительный просмотр</h4>
            <p>Страница успешной оплаты</p>
        </div>
        
        <div class="success-icon">✅</div>
        <h1>Оплата успешна!</h1>
        <div class="success-message">
            Ваш профиль активирован и готов к использованию!
        </div>
        <button class="continue-btn" onclick="alert('Переход в приложение')">
            Перейти в приложение
        </button>
    </div>

    <script>
        // Демонстрация анимаций
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.success-container');
            container.style.opacity = '0';
            container.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.5s ease';
                container.style.opacity = '1';
                container.style.transform = 'scale(1)';
            }, 100);
        });
    </script>
</body>
</html>
