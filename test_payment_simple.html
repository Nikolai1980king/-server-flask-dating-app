<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой тест оплаты</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .container { background: #f9f9f9; padding: 30px; border-radius: 10px; }
        .test-btn { background: #007bff; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px; }
        .test-btn:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        .test-mode { background: #fff3cd; padding: 15px; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Простой тест системы оплаты</h1>
        
        <div class="test-mode">
            <strong>🧪 ТЕСТОВЫЙ РЕЖИМ</strong><br>
            Все платежи тестовые - реальные деньги не списываются
        </div>

        <h3>1. Создать тестовый профиль</h3>
        <button class="test-btn" onclick="createTestProfile()">Создать профиль</button>
        <div id="profileResult" class="result" style="display: none;"></div>

        <h3>2. Создать платеж</h3>
        <button class="test-btn" onclick="createPayment()" id="paymentBtn" disabled>Создать платеж</button>
        <div id="paymentResult" class="result" style="display: none;"></div>

        <h3>3. Проверить админ панель</h3>
        <button class="test-btn" onclick="openAdminPanel()">Открыть админ панель</button>

        <h3>4. Ссылки</h3>
        <p><a href="/" target="_blank">🏠 Главная страница</a></p>
        <p><a href="/create" target="_blank">➕ Создать профиль</a></p>
        <p><a href="/payment" target="_blank">💳 Страница оплаты</a></p>
        <p><a href="/admin/payments" target="_blank">👁️ Админ панель</a></p>
    </div>

    <script>
        let currentUserId = null;

        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = `result ${type}`;
            element.textContent = message;
        }

        async function createTestProfile() {
            showResult('profileResult', '🔄 Создаем тестовый профиль...', 'info');
            
            try {
                const formData = new FormData();
                formData.append('name', 'Тестовый Пользователь');
                formData.append('age', '25');
                formData.append('gender', 'Мужчина');
                formData.append('hobbies', 'Тестирование системы оплаты');
                formData.append('goal', 'Тестирование');
                formData.append('city', 'Москва');
                formData.append('venue', 'Тестовое кафе');
                formData.append('latitude', '55.7558');
                formData.append('longitude', '37.6176');

                const response = await fetch('/create', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const text = await response.text();
                    // Извлекаем ID из ответа (простой способ)
                    const match = text.match(/profile\/([a-f0-9-]+)/);
                    if (match) {
                        currentUserId = match[1];
                        showResult('profileResult', `✅ Профиль создан успешно!\n🆔 ID: ${currentUserId}`, 'success');
                        document.getElementById('paymentBtn').disabled = false;
                    } else {
                        showResult('profileResult', '✅ Профиль создан, но ID не найден в ответе', 'success');
                        document.getElementById('paymentBtn').disabled = false;
                    }
                } else {
                    showResult('profileResult', `❌ Ошибка создания профиля: ${response.status}`, 'error');
                }
            } catch (error) {
                showResult('profileResult', `❌ Ошибка: ${error.message}`, 'error');
            }
        }

        async function createPayment() {
            if (!currentUserId) {
                showResult('paymentResult', '❌ Сначала создайте профиль', 'error');
                return;
            }

            showResult('paymentResult', '🔄 Создаем платеж...', 'info');
            
            try {
                const response = await fetch('/payment/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: currentUserId,
                        amount: 50.0
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    showResult('paymentResult', `✅ Платеж создан успешно!\n💰 Сумма: ${data.amount} руб.\n🔗 URL: ${data.payment_url}`, 'success');
                    
                    // Автоматически открываем ссылку на оплату
                    setTimeout(() => {
                        window.open(data.payment_url, '_blank');
                    }, 1000);
                } else {
                    showResult('paymentResult', `❌ Ошибка создания платежа: ${data.error}`, 'error');
                }
            } catch (error) {
                showResult('paymentResult', `❌ Ошибка: ${error.message}`, 'error');
            }
        }

        function openAdminPanel() {
            window.open('/admin/payments', '_blank');
        }

        // Проверяем доступность сервера при загрузке
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/');
                if (response.ok) {
                    console.log('✅ Сервер доступен');
                }
            } catch (error) {
                console.warn('⚠️ Сервер недоступен:', error.message);
            }
        });
    </script>
</body>
</html>
